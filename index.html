    /* Floating Keyframe Animations for Background Stationery */
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) translateX(0px) rotate(0deg); }
      33% { transform: translateY(-22px) translateX(12px) rotate(6deg); }
      66% { transform: translateY(12px) translateX(-8px) rotate(-5deg); }

    @keyframes float2 {
      0%, 100% { transform: translateY(0px) translateX(0px) rotate(0deg); }
      50% { transform: translateY(-28px) translateX(-16px) rotate(-10deg); }
    }
    @keyframes float3 {
      0%, 100% { transform: translateY(0px) translateX(0px) rotate(0deg); }
      50% { transform: translateY(24px) translateX(18px) rotate(12deg); }
    }

    .anim-float-1 { animation: float1 20s ease-in-out infinite; }
    .anim-float-2 { animation: float2 26s ease-in-out infinite; }
    .anim-float-3 { animation: float3 18s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .anim-float-1, .anim-float-2, .anim-float-3 { animation: none !important; }

        global: {
          fetch: async (input, init = {}) => {
            const requestUrl = typeof input === 'string' ? input : (input?.url || '');

              requestUrl.includes('grant_type=password');
            try {
              return await fetch(input, init);

    let currentLang = 'en';

    function t(path, params = {}) {
      const keys = path.split('.');
      let current = i18nDict[currentLang] || i18nDict.en;
      for (const k of keys) {
        if (current && current[k] !== undefined) {
          current = current[k];
        } else {
          let fallback = i18nDict.en;
          for (const fk of keys) {
            if (fallback && fallback[fk] !== undefined) {
              fallback = fallback[fk];
            } else {
              return path;
            }
          }
          current = fallback;
          break;
        }
      }
      if (typeof current === 'string') {
        let result = current;
        for (const [pKey, pVal] of Object.entries(params)) {
          result = result.replace(new RegExp(`\\{${pKey}\\}`, 'g'), pVal);
        }
        return result;
      }
      return current;
    }

    function formatInstructionsAsBullets(instText) {
      if (!instText || typeof instText !== 'string' || !instText.trim()) {
        return `<ul class="space-y-1.5 text-slate-700 dark:text-slate-300 text-xs"><li class="flex items-start gap-2.5"><span class="w-1.5 h-1.5 rounded-full bg-blue-500 shrink-0 mt-1.5"></span><span class="font-medium leading-relaxed text-xs">Please read the circular carefully and follow the stated eligibility, registration, payment, and deadline requirements.</span></li></ul>`;
      }

      let cleaned = instText
        .replace(/^#+\s+/gm, '')
        .replace(/\*\*([^*]+)\*\*/g, '$1')
        .replace(/\*([^*]+)\*/g, '$1')
        .replace(/`([^`]+)`/g, '$1')
        .replace(/~~([^~]+)~~/g, '$1');

      let rawItems = [];

      if (cleaned.includes('\n')) {
        rawItems = cleaned.split(/\n+/);
      } else {
        const numberedOrBulleted = cleaned.split(/(?:\s*[\;\•\-\*]\s+|\s*\b\d+[\.\)]\s+)/);
        if (numberedOrBulleted.length > 1) {
          rawItems = numberedOrBulleted;
        } else {
          const sentences = cleaned.split(/(?<=\.)\s+(?=[A-Z0-9])/);
          if (sentences.length > 1) {
            rawItems = sentences;
          } else {
            rawItems = [cleaned];
          }
        }
      }

      const finalBullets = [];
      rawItems.forEach(item => {
        let text = item.trim();
        text = text.replace(/^[\*\-\•\d+\.\)\s]+/, '').trim();
        if (text.length > 0) {
          finalBullets.push(text);
        }
      });

      if (finalBullets.length === 0) {
        return `<p class="text-slate-400 italic text-xs">${t('common.noInstructions')}</p>`;
      }

      return `
        <ul class="space-y-1.5 text-slate-700 dark:text-slate-300 text-xs">
          ${finalBullets.map(bullet => `
            <li class="flex items-start gap-2.5">
              <span class="w-1.5 h-1.5 rounded-full bg-blue-500 shrink-0 mt-1.5"></span>
              <span class="font-medium leading-relaxed text-xs">${bullet}</span>
            </li>
          `).join('')}
        </ul>
      `;
    }

    // Supabase task persistence: map the app's existing action objects to public.tasks.
    let taskSyncRunning = false;

    async function syncTasksToSupabase() {
      if (taskSyncRunning || !window.supabase) return;
      taskSyncRunning = true;
      try {
        const { data: authData, error: authError } = await supabaseClient.auth.getUser();
        if (authError || !authData?.user) return;
        const userId = authData.user.id;

        for (const task of (appData.actions || [])) {
          const payload = {
            user_id: userId,
            title: task.title || 'Untitled task',
            due_date: task.dueDate || null,
            completed: Boolean(task.completed),
            // Circular references in this app use labels like SPORTS-2026-001, not UUIDs.
            // Leave the optional database UUID reference empty until circulars have UUID mapping.
            circular_id: null,
            category: task.category || null,
            priority: task.priority || 'Medium',
            description: task.description || null,
            completed_at: task.completedAt || null
          };

          const isUuid = typeof task.id === 'string' &&
            /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(task.id);

          if (isUuid) {
            const { error } = await supabaseClient
              .from('tasks')
              .update(payload)
              .eq('id', task.id)
              .eq('user_id', userId);
            if (error) {
              console.error('Could not update task in Supabase:', error);
              showToast(`Task sync failed: ${error.message}`, 'error');
            }
          } else {
            const { data, error } = await supabaseClient
              .from('tasks')
              .insert(payload)
              .select('id')
              .single();
            if (error) {
              console.error('Could not save task to Supabase:', error);
              showToast(`Task save failed: ${error.message}`, 'error');
            } else if (data?.id) {
              task.id = data.id;
            }
          }
        }
      } catch (err) {
        console.error('Unexpected task sync error:', err);
      } finally {
        taskSyncRunning = false;
      }
    }

    async function loadTasksFromSupabase(showMessage = false) {
      try {
        const { data: authData, error: authError } = await supabaseClient.auth.getUser();
        if (authError || !authData?.user) return false;

        const { data: rows, error } = await supabaseClient
          .from('tasks')
          .select('*')
          .eq('user_id', authData.user.id)
          .order('created_at', { ascending: false });

        if (error) {
          console.error('Supabase task load failed:', error);
          if (showMessage) showToast(`Could not load tasks: ${error.message}`, 'error');
          return false;
        }

        // Existing local demo tasks are retained only when this account has no database tasks yet.
        if (rows && rows.length > 0) {
          appData.actions = rows.map(row => ({
            id: row.id,
            title: row.title || 'Untitled task',
            dueDate: row.due_date || '',
            completed: Boolean(row.completed),
            circularId: row.circular_id || null,
            category: row.category || 'General',
            priority: row.priority || 'Medium',
            description: row.description || '',
            completedAt: row.completed_at || null
          }));
        } else {
          await syncTasksToSupabase();
        }

        if (showMessage) showToast(`Loaded ${(rows || []).length} task(s) from Supabase.`);
        return true;
      } catch (err) {
        console.error('Unexpected error loading tasks:', err);
        if (showMessage) showToast('Could not load tasks from Supabase.', 'error');
        return false;
      }
    }

      void syncTasksToSupabase();
    }

    async function loadCircularsFromSupabase(showMessage = false) {
      try {
        const { data: authData, error: authError } = await supabaseClient.auth.getUser();
        if (authError || !authData?.user) {
          if (showMessage) showToast('Please log in again to load your saved circulars.', 'error');
          return false;
        }

        const { data: rows, error } = await supabaseClient
          .from('circulars')
          .select('*')
          .eq('user_id', authData.user.id)
          .order('created_at', { ascending: false });

        if (error) {
          console.error('Supabase circular load failed:', error);
          if (showMessage) showToast(`Could not load circulars: ${error.message}`, 'error');
          return false;
        }

        const databaseCirculars = (rows || []).map(row => ({
          id: row.id,
          title: row.title || 'Untitled Circular',
          department: row.department || 'General',
          issueDate: row.issue_date || '',
          eventDate: row.event_date || '',
          eventTime: row.event_time || '',
          deadline: row.deadline || '',
          venue: row.venue || '',
          fee: row.fee || 'Free',
          eligibility: row.eligibility || '',
          status: row.status || 'Active',
          version: row.version || '1.0',
          category: row.category || 'General',
          instructions: row.instructions || '',
          rawContent: row.raw_content || ''
        }));

        const existingCirculars = appData.circulars || [];
        const databaseIds = new Set(databaseCirculars.map(item => String(item.id)));
        const localOnlyCirculars = existingCirculars.filter(item => !databaseIds.has(String(item.id)));

        appData.circulars = [...databaseCirculars, ...localOnlyCirculars];
        saveAppData();

        // Refresh the visible page after the database results arrive.
        renderPage();
        if (showMessage) showToast(`Loaded ${databaseCirculars.length} circular(s) from Supabase.`);
        return true;
      } catch (err) {
        console.error('Unexpected error loading circulars:', err);
        if (showMessage) showToast('Could not load circulars from Supabase.', 'error');
        return false;
      }
    }

    async function extractTextFromPDFBuffer(arrayBuffer) {
      if (!window.pdfjsLib) return '';
      try {
        const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
        const pdf = await loadingTask.promise;
        let fullText = '';
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          const pageText = textContent.items.map(item => item.str).join(' ');
          fullText += pageText + '\n';
        }
        console.log("PDF EXTRACTED TEXT:", fullText);
        return fullText.trim();
      } catch (err) {
        console.warn("PDF.js text extraction error:", err);
        return '';
      }
    }

    async function extractTextFromImage(dataUrl) {
      if (!window.Tesseract) return '';
      try {
        const result = await Tesseract.recognize(dataUrl, 'eng');
        return result.data.text || '';
      } catch (err) {
        console.warn("Tesseract OCR error:", err);
        return '';
      }
    }

    function handleFileSelect(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      const info = document.getElementById('fileSelectedInfo');
      
      const isPdf = file.name.toLowerCase().endsWith('.pdf') || file.type === 'application/pdf';
      const isImg = file.type.startsWith('image/') || /\.(png|jpg|jpeg)$/i.test(file.name);
      const isTxt = file.type === 'text/plain' || file.name.toLowerCase().endsWith('.txt');

      if (!isPdf && !isImg && !isTxt) {
        showToast(t('upload.invalidType'), 'error');
        input.value = '';
        return;
      }

      if (file.size > 12 * 1024 * 1024) {
        showToast('File size exceeds 12MB limit.', 'error');
        input.value = '';
        return;
      }

      info.innerText = `${t('upload.fileSelected')} ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
      info.classList.remove('hidden');

      currentUploadedFile = {
        name: file.name,
        size: file.size,
        type: isPdf ? 'application/pdf' : (isImg ? (file.type || 'image/jpeg') : 'text/plain'),
        arrayBuffer: null,
        base64Data: null,
        textContent: ''
      };

      const reader = new FileReader();
      if (isPdf) {
        reader.onload = function(e) { currentUploadedFile.arrayBuffer = e.target.result; };
        reader.readAsArrayBuffer(file);
      } else if (isImg) {
        reader.onload = function(e) {
          const dataUrl = e.target.result;
          currentUploadedFile.base64Data = dataUrl.split(',')[1];
          currentUploadedFile.base64Url = dataUrl;
        };
        reader.readAsDataURL(file);
      } else {
        reader.onload = function(e) { currentUploadedFile.textContent = e.target.result; };
        reader.readAsText(file);
      }
    }

    async function processNoticeExtraction() {
      const pasteText = document.getElementById('pasteNoticeText')?.value || '';
      const extractBtn = document.getElementById('extractNoticeBtn');
      const btnSpinner = document.getElementById('extractBtnSpinner');
      const btnText = document.getElementById('extractBtnText');

      if (!currentUploadedFile && !pasteText.trim()) {
        return showToast('Please upload a file or paste notice text first.', 'error');
      }

      if (extractBtn) extractBtn.disabled = true;
      if (btnSpinner) btnSpinner.classList.remove('hidden');
      if (btnText) btnText.innerText = t('upload.extractingBtn');

      try {
        let extractedFields = null;
        let rawSourceText = pasteText;

        if (currentUploadedFile) {
          if (currentUploadedFile.type === 'application/pdf' && currentUploadedFile.arrayBuffer) {
            const pdfText = await extractTextFromPDFBuffer(currentUploadedFile.arrayBuffer);
            if (pdfText && pdfText.length > 15) {
              rawSourceText = pdfText + (pasteText ? '\n' + pasteText : '');
              extractedFields = await callGeminiExtractFromText(rawSourceText);
            } else if (currentUploadedFile.base64Data) {
              extractedFields = await callGeminiExtractFromFile(currentUploadedFile.base64Data, currentUploadedFile.type, pasteText);
            }
          } else if (currentUploadedFile.base64Data) {
            extractedFields = await callGeminiExtractFromFile(currentUploadedFile.base64Data, currentUploadedFile.type, pasteText);
            if (!extractedFields && currentUploadedFile.base64Url) {
              const ocrText = await extractTextFromImage(currentUploadedFile.base64Url);
              rawSourceText = ocrText + (pasteText ? '\n' + pasteText : '');
            }
          } else if (currentUploadedFile.textContent) {
            rawSourceText = currentUploadedFile.textContent + (pasteText ? '\n' + pasteText : '');
            extractedFields = await callGeminiExtractFromText(rawSourceText);
          }
        } else {
          extractedFields = await callGeminiExtractFromText(pasteText);
        }

        if (!extractedFields) {
          extractedFields = extractNoticeFields(rawSourceText);
        }

        renderReviewFormModal(extractedFields, rawSourceText);
      } catch (err) {
        console.error('Extraction failure:', err);
        const fallbackText = ((currentUploadedFile?.textContent || '') + '\n' + pasteText).trim();
        const fallbackFields = extractNoticeFields(fallbackText);
        renderReviewFormModal(fallbackFields, fallbackText || 'Extracted via fallback structure parser.');
        showToast('Extracted document details via fallback parser.', 'success');
      } finally {
        if (extractBtn) extractBtn.disabled = false;
        if (btnSpinner) btnSpinner.classList.add('hidden');
        if (btnText) btnText.innerText = t('upload.extractBtn');
      }
    }

    async function callGeminiExtractFromFile(base64Data, mimeType, additionalText = '') {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 9000);

      try {
       const prompt = `Extract college circular information accurately from the provided document.

Rules:
- Use only information explicitly present in the document or additional context.
- Never invent, guess, or assume dates, deadlines, fees, venues, eligibility, or names.
- If a field is missing or unclear, return an empty string.
- Preserve the original meaning of official instructions.
- Return instructions as a string with each instruction on a separate line, starting with "• ".
- Keep dates in YYYY-MM-DD format only when the date is clear.
- Do not confuse the issue date, event date, and submission deadline.
- Return all fields using the exact names listed below.

Fields:
title, refId, dept, issueDate, eventDate, eventTime, deadlineDate, venue, fee, eligibility, instructions.

${additionalText ? 'Additional context: ' + additionalText : ''}

Return only a valid JSON object without markdown formatting.`;

        const mime = mimeType.includes('pdf') ? 'application/pdf' : (mimeType.includes('png') ? 'image/png' : 'image/jpeg');

        const payload = {
          contents: [{
            parts: [
              { text: prompt },
              { inlineData: { mimeType: mime, data: base64Data } }
            ]
          }],
          generationConfig: { responseMimeType: "application/json" }
        };

        const apiKey = "";
        if (!apiKey) return null; // Use the local PDF/OCR parser unless a secure backend is configured.
        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

        const res = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          signal: controller.signal
        });

        clearTimeout(timeoutId);
        if (!res.ok) return null;

        const data = await res.json();
        const textResp = data.candidates?.[0]?.content?.parts?.[0]?.text;
        if (textResp) {
          const parsed = JSON.parse(textResp);
          if (parsed.deadlineDate) parsed.deadlineDetected = true;
          return parsed;
        }
      } catch (e) {
        console.warn("Gemini file extraction fallback:", e);
      } finally {
        clearTimeout(timeoutId);
      }
      return null;
    }

    // Local-first extraction: this app must work without a browser-exposed Gemini API key.
    // Text is extracted from PDFs locally by PDF.js; the deterministic parser below handles it.
    async function callGeminiExtractFromText(text) {
      if (!text || text.trim().length < 15) return null;
      // No API key is configured in this file. Returning null safely activates the local parser.
      // Do not place a private Gemini API key in public client-side HTML.
      return null;
    }

    function parseFlexibleDate(str) {
      if (!str) return '';
      const isoMatch = str.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      if (isoMatch) return `${isoMatch[1]}-${isoMatch[2].padStart(2, '0')}-${isoMatch[3].padStart(2, '0')}`;
      
      const dmyMatch = str.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
      if (dmyMatch) return `${dmyMatch[3]}-${dmyMatch[2].padStart(2, '0')}-${dmyMatch[1].padStart(2, '0')}`;

      const d = new Date(str);
      if (!isNaN(d.getTime())) return d.toISOString().split('T')[0];
      return '';
    }

    function extractNoticeFields(text) {
      const source = String(text || '').replace(/\r/g, '\n').replace(/[\t ]+/g, ' ');
      const fields = {
        title: '', refId: '', dept: '',
        issueDate: '', eventDate: '', eventTime: '', deadlineDate: '',
        venue: '', fee: '', eligibility: '', instructions: '', deadlineDetected: false
      };
      const flat = source.replace(/\n+/g, ' ').replace(/\s+/g, ' ').trim();
      const lines = source.split(/\n+/).map(line => line.trim()).filter(Boolean);

      // Prefer the actual subject/event title over the college heading.
      const subjectMatch = flat.match(/(?:subject|event|programme|program|title)\s*[:\-]\s*(.{3,140}?)(?=\s+(?:event date|event time|registration fee|registration deadline|venue|eligibility|official instructions|issued by)\b|$)/i);
      if (subjectMatch) fields.title = subjectMatch[1].trim().replace(/[.;]+$/, '').slice(0, 120);
      if (!fields.title) {
        const titleLine = lines.find(line => /\b(subject|event|sprint|fest|workshop|seminar|hackathon|conference|competition)\b/i.test(line) && !/college of|department of/i.test(line));
        fields.title = (titleLine || lines[0] || '').replace(/^(notice|subject|circular|title)[:\s-]*/i, '').slice(0, 120);
      }

      const refMatch = flat.match(/(?:circular\s*(?:no\.?|number|id)|reference\s*(?:no\.?|number|id)|ref\s*(?:no\.?|number|id)|\bID)\s*[:#.]?\s*([A-Z0-9][A-Z0-9\/-]{3,30})/i);
      if (refMatch) fields.refId = refMatch[1].replace(/[.,;]+$/, '');

      const deptMatch = flat.match(/(?:department\s+of|department|dept\.?|issued\s+by|organized\s+by|organised\s+by|office\s+of)\s*[:\-]?\s*([A-Za-z][A-Za-z &(),-]{2,65}?)(?=\s+(?:official circular|circular no|issue date|event|subject|registration|venue|eligibility|official instructions)\b|[.;]|$)/i);
      if (deptMatch) fields.dept = deptMatch[1].trim().slice(0, 65);

      const issueMatch = flat.match(/(?:issue\s+date|issued\s+on|date\s+of\s+issue)\s*[:\-]?\s*(\d{1,2}\s+[A-Za-z]+\s+\d{4}|[A-Za-z]+\s+\d{1,2},?\s+\d{4}|\d{1,2}[-\/]\d{1,2}[-\/]\d{4}|\d{4}-\d{2}-\d{2})/i);
      if (issueMatch) fields.issueDate = parseFlexibleDate(issueMatch[1]);

      // Capture dates from explicitly labelled fields, preventing the issue date from being mistaken for the event date.
      const eventMatch = flat.match(/(?:event\s+date|date\s+of\s+event|event\s+will\s+be\s+held\s+on|scheduled\s+for)\s*[:\-]?\s*(\d{1,2}\s+[A-Za-z]+\s+\d{4}|[A-Za-z]+\s+\d{1,2},?\s+\d{4}|\d{1,2}[-\/]\d{1,2}[-\/]\d{4}|\d{4}-\d{2}-\d{2})/i);
      if (eventMatch) fields.eventDate = parseFlexibleDate(eventMatch[1]);

      const deadlineMatch = flat.match(/(?:registration\s+deadline|registration\s+closes|last\s+date(?:\s+for\s+registration)?|submission\s+deadline|deadline|register\s+by|submit\s+by|applications\s+close|payment\s+deadline|fee\s+due)\s*[:\-]?\s*(\d{1,2}\s+[A-Za-z]+\s+\d{4}|[A-Za-z]+\s+\d{1,2},?\s+\d{4}|\d{1,2}[-\/]\d{1,2}[-\/]\d{4}|\d{4}-\d{2}-\d{2})(?:\s*(?:at|,)?\s*(\d{1,2}[:.]\d{2}\s*(?:AM|PM)?))?/i);
      if (deadlineMatch) {
        fields.deadlineDate = parseFlexibleDate(deadlineMatch[1]);
        fields.deadlineDetected = !!fields.deadlineDate;
      }

      const timeMatch = flat.match(/(?:event\s+time|time|timings)\s*[:\-]?\s*(\d{1,2}(?::\d{2})?\s*(?:AM|PM)\s*(?:to|[-–])\s*\d{1,2}(?::\d{2})?\s*PM?|\d{1,2}:\d{2}\s*(?:AM|PM)?)/i);
      if (timeMatch) fields.eventTime = timeMatch[1].replace(/\s+/g, ' ').trim().toUpperCase();

      const venueMatch = flat.match(/(?:venue|location|room|hall|auditorium|place)\s*[:\-]?\s*(.{2,90}?)(?=\s+(?:subject|registration|event date|event time|registration fee|registration deadline|eligibility|official instructions|team size|issued by)\b|[.;]|$)/i);
      if (venueMatch) fields.venue = venueMatch[1].trim().replace(/[.,;]+$/, '').slice(0, 90);

      // Handles currency symbols and OCR's common loss of the rupee symbol (e.g. "n 250").
      const feeMatch = flat.match(/(?:registration\s+fee|participation\s+fee|entry\s+fee|fee\s+amount|fee|amount|cost|charge)\s*[:\-]?\s*((?:₹|Rs\.?|INR|\$|n)\s*\d[\d,]*(?:\.\d{1,2})?(?:\s+per\s+(?:participant|team|person))?|free|no\s+fee)/i);
      if (feeMatch) {
        let fee = feeMatch[1].trim().replace(/\s+/g, ' ');
        if (/^n\s*\d/i.test(fee)) fee = fee.replace(/^n\s*/i, '₹ ');
        fields.fee = fee.slice(0, 50);
      }

      const eligibilityMatch = flat.match(/(?:eligibility|eligible|open\s+to|for\s+students\s+of)\s*[:\-]?\s*(.{3,100}?)(?=\s+(?:team size|registration fee|registration deadline|event date|venue|official instructions|issued by)\b|[.;]|$)/i);
      if (eligibilityMatch) fields.eligibility = eligibilityMatch[1].trim().slice(0, 100);

      // Extract the official instructions section only; split bullet separators even when PDF.js returns one line.
      const instructionsMatch = flat.match(/official\s+instructions?\s*[:\-]?\s*(.+?)(?=\s+issued\s+by\s*:|\s+authorized\s+signatory|\s+this\s+is\s+a\s+fictional|$)/i);
      if (instructionsMatch) {
        let instructionText = instructionsMatch[1].trim();
        instructionText = instructionText.replace(/\s*[•●▪◦]\s*/g, '\n• ')
          .replace(/\s+(?=(?:Complete|Pay|Each team|Bring|Teams must|Late registrations|For queries|Submit|Register|Participants must)\b)/g, '\n• ');
        const items = instructionText.split(/\n+/).map(item => item.replace(/^\s*[•*\-\d.)]+\s*/, '').trim()).filter(Boolean);
        fields.instructions = [...new Set(items)].map(item => '• ' + item).join('\n');
      }
      if (!fields.instructions) {
        fields.instructions = '• Please read the circular carefully and follow the eligibility criteria, registration process, payment requirements, and stated deadlines.';
      }

      return fields;
    }

    async function saveExtractedCircular() {
      const title = document.getElementById('revTitle')?.value?.trim();
      const ref = document.getElementById('revRef')?.value?.trim();
      const dept = document.getElementById('revDept')?.value;
      const evtDate = document.getElementById('revEventDate')?.value;
      const deadline = document.getElementById('revDeadline')?.value;
      const venue = document.getElementById('revVenue')?.value;
      const fee = document.getElementById('revFee')?.value;
      const eligibility = document.getElementById('revEligibility')?.value;
      const inst = document.getElementById('revInst')?.value;

      if (!title) return showToast('Notice title is required', 'error');

      // Require a real Supabase session so the row is attached to the correct user.
      const { data: authData, error: authError } = await supabaseClient.auth.getUser();
      if (authError || !authData?.user) {
        console.error('Supabase user check failed:', authError);
        return showToast('Your session is not active. Please log in again.', 'error');
      }

      const user = authData.user;
      const issueDate = new Date().toISOString().split('T')[0];
      const newCirc = {
        id: ref || `CIRC-${Date.now().toString().slice(-4)}`,
        title,
        department: dept || 'General',
        issueDate,
        eventDate: evtDate || '',
        deadline: deadline || '',
        venue: venue || '',
        fee: fee || 'Free',
        eligibility: eligibility || '',
        status: 'Active',
        version: '1.0',
        category: 'General',
        instructions: inst || ''
      };

      // Save the circular to Supabase first. The database generates its UUID id.
      const { data: savedCircular, error: saveError } = await supabaseClient
        .from('circulars')
        .insert({
          user_id: user.id,
          title: newCirc.title,
          department: newCirc.department,
          issue_date: newCirc.issueDate,
          event_date: newCirc.eventDate || null,
          deadline: newCirc.deadline || null,
          venue: newCirc.venue,
          fee: newCirc.fee,
          eligibility: newCirc.eligibility,
          instructions: newCirc.instructions,
          status: newCirc.status
        })
        .select('id')
        .single();

      if (saveError) {
        console.error('Supabase circular insert failed:', saveError);
        return showToast(`Could not save circular to database: ${saveError.message}`, 'error');
      }

      // Keep the database UUID as the circular ID so related records can refer to it.
      newCirc.id = savedCircular.id;
      appData.circulars.unshift(newCirc);

      if (deadline) {
        appData.actions.unshift({
          id: `ACT-${Date.now()}`,
          title: `${title} — Submission / Registration`,
          dueDate: deadline,
          completed: false,
          circularId: newCirc.id,
          priority: 'High',
          description: inst
        });
      }

      if (evtDate) {
        appData.events.push({
          id: `EVT-${Date.now()}`,
          title,
          date: evtDate,
          category: 'Academics',
          venue: venue || '',
          circularId: newCirc.id
        });
      }

      if (fee && fee.toLowerCase() !== 'free' && fee.toLowerCase() !== 'n/a' && fee !== '0') {
        appData.fees.push({
          id: `FEE-${Date.now()}`,
          title,
          amount: fee,
          dueDate: deadline || evtDate || issueDate,
          status: 'Pending',
          circularId: newCirc.id
        });
      }
      await syncTasksToSupabase();
      saveAppData();
      closeModal();
      showToast(t('common.successToast'));
      navigateTo('circulars');
    }

    function renderCalendarGrid() {
      const grid = document.getElementById('calendarGrid');
      if (!grid) return;
      grid.innerHTML = '';
      
      const monthNames = t('calendar.months');
      document.getElementById('calMonthYearTitle').innerText = `${monthNames[calendarMonth]} ${calendarYear}`;

      const firstDay = new Date(calendarYear, calendarMonth, 1).getDay();
      const offset = (firstDay === 0 ? 6 : firstDay - 1);
      const daysInMonth = new Date(calendarYear, calendarMonth + 1, 0).getDate();

      const todayStr = new Date().toISOString().split('T')[0];

      for (let i = 0; i < offset; i++) {
        const cell = document.createElement('div');
        cell.className = 'h-20 lg:h-24 p-1 rounded-xl bg-slate-50/50 dark:bg-slate-800/20 opacity-40';
        grid.appendChild(cell);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateFormatted = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayEvents = appData.events.filter(e => e.date === dateFormatted);
        const dayActions = appData.actions.filter(a => a.dueDate === dateFormatted);
        const isSelected = selectedDateStr === dateFormatted;
        const isToday = todayStr === dateFormatted;

        const cell = document.createElement('div');
        cell.className = `h-20 lg:h-24 p-2 rounded-xl border transition cursor-pointer flex flex-col justify-between ${
          isSelected 
            ? 'border-blue-500 bg-blue-50/70 dark:bg-blue-950/50 ring-2 ring-blue-500/30 shadow-md' 
            : (isToday ? 'border-indigo-400 bg-indigo-50/40 dark:bg-indigo-950/20' : 'border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:border-slate-300')
        }`;

        cell.onclick = () => {
          selectedDateStr = dateFormatted;
          renderCalendarGrid();
          openDatePopUpModal(dateFormatted);
        };

        cell.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-xs font-black ${isToday ? 'px-1.5 py-0.5 rounded-md bg-indigo-600 text-white' : (isSelected ? 'text-blue-600 dark:text-blue-400' : 'text-slate-700 dark:text-slate-300')}">${day}</span>

              <div class="flex items-center gap-1">
                ${dayEvents.map(e => `<span class="w-1.5 h-1.5 rounded-full ${getCategoryDotColor(e.category)}"></span>`).join('')}

              <div class="text-[9px] font-bold px-1.5 py-0.5 rounded truncate ${getCategoryBadgeStyle(e.category)}">${e.title}</div>

            `).join('')}
          </div>
        `;
        grid.appendChild(cell);
      }
    }

    async function handleChatQuery() {
      const input = document.getElementById('assistantInput');
      const query = input.value.trim();
      if (!query) return;

      const history = document.getElementById('chatHistory');
      history.innerHTML += `<div class="p-3 rounded-xl bg-blue-600 text-white text-xs text-right font-semibold">${query}</div>`;
      input.value = '';

      const loadingId = 'loading-' + Date.now();
      history.innerHTML += `
        <div id="${loadingId}" class="p-3 rounded-xl bg-slate-200 dark:bg-slate-700 text-xs text-slate-600 dark:text-slate-300 flex items-center gap-2">
          <i data-lucide="loader-2" class="w-4 h-4 animate-spin text-blue-600"></i>
          <span>${t('assistant.thinking')}</span>
        </div>
      `;
      history.scrollTop = history.scrollHeight;
      lucide.createIcons();

      const lower = query.toLowerCase();
      let reply = '';
      let actionButtons = '';

      if (lower.includes('deadline') || lower.includes('task') || lower.includes('due')) {
        const pending = appData.actions.filter(a => !a.completed);
        if (pending.length > 0) {
          reply = `Here are your upcoming deadlines:\n` + pending.slice(0, 3).map(a => `• ${a.title} (Due: ${a.dueDate})`).join('\n');
          actionButtons = `<button onclick="navigateTo('deadlines')" class="mt-2 px-3 py-1 bg-blue-600 text-white rounded text-[10px] font-bold">View Deadlines &rarr;</button>`;
        } else {
          reply = "You have no pending deadlines at the moment!";
        }
      } else if (lower.includes('fee') || lower.includes('unpaid') || lower.includes('payment')) {
        const pendingFees = appData.fees.filter(f => f.status === 'Pending');
        if (pendingFees.length > 0) {
          reply = `Unpaid Fees (${pendingFees.length}):\n` + pendingFees.map(f => `• ${f.title}: ${f.amount} (Due: ${f.dueDate})`).join('\n');
          actionButtons = `<button onclick="navigateTo('fees')" class="mt-2 px-3 py-1 bg-rose-600 text-white rounded text-[10px] font-bold">Open Fee Tracker &rarr;</button>`;
        } else {
          reply = "All your fee payments are up to date!";
        }
      } else if (lower.includes('circular') || lower.includes('notice') || lower.includes('summary')) {
        const latest = appData.circulars[0];
        if (latest) {
          reply = `Latest Circular [${latest.id}]: ${latest.title}\nDepartment: ${latest.department}\nEvent Date: ${latest.eventDate || 'N/A'}\nDeadline: ${latest.deadline || 'N/A'}`;
          actionButtons = `<button onclick="openCircularDetailModal('${latest.id}')" class="mt-2 px-3 py-1 bg-purple-600 text-white rounded text-[10px] font-bold">Open Notice Details &rarr;</button>`;
        }
      }

      if (!reply) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 7000);

          const payload = {
            contents: [{ parts: [{ text: `Answer this student's query concisely: ${query}` }] }],
            systemInstruction: { parts: [{ text: "You are Remyndr AI, a helpful academic assistant." }] }
          };
          const apiKey = "";
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          if (res.ok) {
            const data = await res.json();
            reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
          }
        } catch (e) {
          console.warn("AI fallback:", e);
        }

        if (!reply) {
          reply = "For general study or academic inquiries: Organize your study schedules, complete high-priority circular tasks early, and review official campus notices on the Academic Calendar.";
        }
      }

      document.getElementById(loadingId)?.remove();
      history.innerHTML += `
        <div class="p-3.5 rounded-xl bg-slate-200 dark:bg-slate-700 text-xs text-slate-800 dark:text-slate-100 space-y-1">
          <p class="whitespace-pre-wrap">${reply}</p>
          ${actionButtons}
        </div>
      `;
      history.scrollTop = history.scrollHeight;
    }

    function handleRevisionFileSelect(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      const info = document.getElementById('revFileSelectedInfo');

      const isPdf = file.name.toLowerCase().endsWith('.pdf') || file.type === 'application/pdf';
      const isImg = file.type.startsWith('image/') || /\.(png|jpg|jpeg)$/i.test(file.name);
      const isTxt = file.type === 'text/plain' || file.name.toLowerCase().endsWith('.txt');

      if (!isPdf && !isImg && !isTxt) {
        showToast(t('upload.invalidType'), 'error');
        input.value = '';
        return;
      }

      info.innerText = `${t('upload.fileSelected')} ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
      info.classList.remove('hidden');

      currentRevisionFile = {
        name: file.name,
        type: isPdf ? 'application/pdf' : (isImg ? (file.type || 'image/jpeg') : 'text/plain'),
        arrayBuffer: null,
        base64Data: null,
        base64Url: null,
        textContent: ''
      };

      const reader = new FileReader();
      if (isPdf) {
        reader.onload = e => currentRevisionFile.arrayBuffer = e.target.result;
        reader.readAsArrayBuffer(file);
      } else if (isImg) {
        reader.onload = e => {
          currentRevisionFile.base64Data = e.target.result.split(',')[1];
          currentRevisionFile.base64Url = e.target.result;
        };
        reader.readAsDataURL(file);
      } else {
        reader.onload = e => currentRevisionFile.textContent = e.target.result;
        reader.readAsText(file);
      }
    }

    async function processRevisionExtraction() {
      const targetId = document.getElementById('updateTargetSelect')?.value;
      const target = appData.circulars.find(c => c.id === targetId);
      const pasteText = document.getElementById('updatePastedText')?.value || '';
      const spinner = document.getElementById('revSpinner');
      const runBtn = document.getElementById('runDiffBtn');

      if (!target) return showToast('Select a notice first', 'error');
      if (!currentRevisionFile && !pasteText.trim()) return showToast('Upload a revised file or paste text first', 'error');

      if (spinner) spinner.classList.remove('hidden');
      if (runBtn) runBtn.disabled = true;

      try {
        let extracted = null;
        let sourceText = pasteText;

        if (currentRevisionFile) {
          if (currentRevisionFile.type === 'application/pdf' && currentRevisionFile.arrayBuffer) {
            const pdfText = await extractTextFromPDFBuffer(currentRevisionFile.arrayBuffer);
            if (pdfText && pdfText.length > 15) {
              sourceText = pdfText + (pasteText ? '\n' + pasteText : '');
              extracted = await callGeminiExtractFromText(sourceText);
            } else if (currentRevisionFile.base64Data) {
              extracted = await callGeminiExtractFromFile(currentRevisionFile.base64Data, currentRevisionFile.type, pasteText);
            }
          } else if (currentRevisionFile.base64Data) {
            extracted = await callGeminiExtractFromFile(currentRevisionFile.base64Data, currentRevisionFile.type, pasteText);
            if (!extracted && currentRevisionFile.base64Url) {
              const ocrText = await extractTextFromImage(currentRevisionFile.base64Url);
              sourceText = ocrText + (pasteText ? '\n' + pasteText : '');
            }
          } else if (currentRevisionFile.textContent) {
            sourceText = currentRevisionFile.textContent + (pasteText ? '\n' + pasteText : '');
            extracted = await callGeminiExtractFromText(sourceText);
          }
        } else {
          extracted = await callGeminiExtractFromText(pasteText);
        }

        if (!extracted) {
          extracted = extractNoticeFields(sourceText);
        }

        document.getElementById('diffResultsContainer').innerHTML = `

                    <td class="p-3 font-bold">${t('circulars.eventDate')}</td>

                    <td class="p-3 font-bold text-emerald-600"><input type="date" id="diffDate" value="${extracted.eventDate || target.eventDate || ''}" class="bg-slate-50 dark:bg-slate-800 p-1.5 rounded border" /></td>
                  </tr>
                  <tr>
                    <td class="p-3 font-bold">${t('circulars.deadline')}</td>
                    <td class="p-3 text-slate-400">${target.deadline || t('common.notSpecified')}</td>
                    <td class="p-3 font-bold text-amber-600"><input type="date" id="diffDeadline" value="${extracted.deadlineDate || target.deadline || ''}" class="bg-slate-50 dark:bg-slate-800 p-1.5 rounded border" /></td>
                  </tr>
                  <tr>
                    <td class="p-3 font-bold">${t('circulars.venue')}</td>
                    <td class="p-3 text-slate-400">${target.venue || t('common.notSpecified')}</td>
                    <td class="p-3 font-bold text-emerald-600"><input type="text" id="diffVenue" value="${extracted.venue || target.venue || ''}" class="bg-slate-50 dark:bg-slate-800 p-1.5 rounded border w-full" /></td>

    function publishCircularUpdate(id) {
      const target = appData.circulars.find(c => c.id === id);
      const newDate = document.getElementById('diffDate')?.value;
      const newDeadline = document.getElementById('diffDeadline')?.value;
      const newVenue = document.getElementById('diffVenue')?.value;

      if (newDate) target.eventDate = newDate;
      if (newDeadline) target.deadline = newDeadline;
      if (newVenue) target.venue = newVenue;

      target.version = (parseFloat(target.version) + 0.1).toFixed(1);

      appData.events.forEach(e => {
        if (e.circularId === id) {
          if (newDate) e.date = newDate;
          if (newVenue) e.venue = newVenue;
        }
      });

      appData.actions.forEach(a => {
        if (a.circularId === id && newDeadline) {
          a.dueDate = newDeadline;
        }
      });

      appData.revisionHistory.unshift({
        revisionId: `REV-${Date.now()}`,
        circularId: id,
        title: target.title,
        version: target.version,
        updatedAt: new Date().toLocaleString(),
        summary: `Updated notice details to v${target.version}`
      });

      saveAppData();
      showToast(t('common.successToast'));
      renderPage();
    }

    async function deleteTask(id) {
      const taskId = String(id);
      const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(taskId);
      if (isUuid && isAuthenticated) {
        const { data: authData } = await supabaseClient.auth.getUser();
        if (authData?.user) {
          const { error } = await supabaseClient.from('tasks').delete()
            .eq('id', taskId).eq('user_id', authData.user.id);

    function executeAccountDeletion() {
      const btn = document.getElementById('confirmDeleteAccBtn');
      const spinner = document.getElementById('deleteAccSpinner');

      if (btn) btn.disabled = true;
      if (spinner) spinner.classList.remove('hidden');

      setTimeout(() => {
        const targetEmail = appData.activeAccountEmail.toLowerCase();

        // 1. Remove from accounts registry
        appData.accounts = appData.accounts.filter(acc => acc.email.toLowerCase() !== targetEmail);

        // 2. Remove user store map entry
        if (appData.userStores && appData.userStores[targetEmail]) {
          delete appData.userStores[targetEmail];
        }

        // 3. Switch to remaining account or reset
        if (appData.accounts.length > 0) {
          const nextAccount = appData.accounts[0];
          switchActiveAccount(nextAccount.email);
        } else {
          appData = JSON.parse(JSON.stringify(INITIAL_SEED_DATA));
          switchActiveAccount(appData.accounts[0].email);
        }

        saveAppData();
        isAuthenticated = false;
        localStorage.removeItem('remyndr_authenticated');

        closeModal();
        showToast('Account and associated data deleted successfully.');
        navigateTo('login');
      }, 400);
    }

              <button onclick="setAuthTab('signup')" class="flex-1 py-2.5 rounded-xl transition-all ${authTab === 'signup' ? 'bg-white dark:bg-slate-700 shadow-md text-blue-600 dark:text-blue-400' : 'text-slate-500 hover:text-slate-900 dark:hover:text-slate-200'}">
                ${t('auth.signupTab')}
              </button>
            </div>

            <!-- LOGIN FORM VIEW -->
            ${authTab === 'login' ? `
              <div class="space-y-4 text-xs animate-in fade-in duration-150">
                <div>
                  <label class="block font-bold mb-1">${t('auth.emailLabel')}</label>
                  <input type="email" id="loginEmail" value="${appData.activeAccountEmail || 'aarav.sharma@example.com'}" placeholder="student@example.com" class="w-full p-3 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-medium focus:ring-2 focus:ring-blue-500 transition" />
                </div>

                <div>
                  <label class="block font-bold mb-1">${t('auth.passwordLabel')}</label>
                  <div class="relative">
                    <input type="password" id="loginPassword" value="demo123" placeholder="••••••••" class="w-full p-3 pr-16 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-medium focus:ring-2 focus:ring-blue-500 transition" />
                    <button type="button" onclick="togglePassVisibility('loginPassword', this)" class="absolute right-3 top-3.5 text-[10px] font-bold text-blue-600 uppercase">
                      ${t('auth.showPass')}
                    </button>
                  </div>
                </div>

                <div class="flex items-center justify-between pt-1">
                  <button onclick="openForgotPasswordModal()" class="text-blue-600 dark:text-blue-400 text-xs font-bold hover:underline">${t('auth.forgotPassBtn')}</button>
                </div>

                <button onclick="executeLogin()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white text-xs font-bold shadow-lg shadow-blue-500/20 transition">
                  ${t('auth.loginBtn')}
                </button>
              </div>
            ` : `
              <!-- CREATE ACCOUNT FORM VIEW -->
              <div class="space-y-3.5 text-xs animate-in fade-in duration-150">
                <div>
                  <label class="block font-bold mb-1">${t('auth.nameLabel')}</label>
                  <input type="text" id="signupName" placeholder="Aarav Sharma" class="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-medium" />
                </div>

                <div>
                  <label class="block font-bold mb-1">${t('auth.emailLabel')}</label>
                  <input type="email" id="signupEmail" placeholder="student@example.com" class="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-medium" />
                </div>

                <div>
                  <label class="block font-bold mb-1">${t('auth.collegeLabel')}</label>
                  <input type="text" id="signupCollege" placeholder="Northstar Institute of Technology" class="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-medium" />
                </div>

                <div>
                  <label class="block font-bold mb-1">${t('auth.passwordLabel')}</label>
                  <input type="password" id="signupPassword" placeholder="••••••••" class="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-medium" />
                </div>

                <div>
                  <label class="block font-bold mb-1">${t('auth.confirmPassLabel')}</label>
                  <input type="password" id="signupConfirmPassword" placeholder="••••••••" class="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none font-medium" />
                </div>

                <button onclick="executeSignup()" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white text-xs font-bold shadow-lg shadow-blue-500/20 transition mt-2">

            <div class="p-3 rounded-xl bg-slate-100 dark:bg-slate-800 text-[10px] text-slate-500 text-center">
              ${t('auth.demoModeNotice')}
            </div>
          </div>
        </div>

    function setAuthTab(tab) {
      authTab = tab;
      const main = document.getElementById('mainContainer');
      if (main) renderLoginPage(main);
    }

    function togglePassVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.innerText = t('auth.hidePass');
      } else {
        input.type = 'password';
        btn.innerText = t('auth.showPass');
      }
    }

    async function executeLogin() {
  const emailInput = document.getElementById('loginEmail')?.value.trim().toLowerCase();
  const passInput = document.getElementById('loginPassword')?.value;

  if (!emailInput || !passInput) {
    return showToast(t('auth.invalidCreds'), 'error');
  }

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: emailInput,
      password: passInput
    });

    if (error) {
      return showToast(error.message, 'error');
    }

    const user = data.user;

    if (!user) {
      return showToast('Login failed. Please try again.', 'error');
    }

    const email = user.email.toLowerCase();
    const displayName =
      user.user_metadata?.display_name ||
      user.user_metadata?.full_name ||
      email.split('@')[0];

    const college =
      user.user_metadata?.college || 'Institute';

    let account = appData.accounts.find(
      a => a.email.toLowerCase() === email
    );

    if (!account) {
      account = { email, displayName, college };
      appData.accounts.push(account);
    } else {
      account.displayName = displayName;
      account.college = college;
    }

    if (!appData.userStores[email]) {
      appData.userStores[email] =
        createDefaultAccountData(email, displayName, college);
    }

    isAuthenticated = true;
    localStorage.setItem('remyndr_authenticated', 'true');

    switchActiveAccount(email);
    await loadTasksFromSupabase(false);
    await loadCircularsFromSupabase(false);
    saveAppData();

    showToast('Logged in successfully!');
    navigateTo('dashboard');

  } catch (err) {
    console.error('Supabase login error:', err);
    const message = String(err?.message || '');
    if (err instanceof TypeError || /failed to fetch|networkerror|load failed/i.test(message)) {
      showToast('Cannot reach Supabase. Check your internet connection and confirm the Supabase project is active.', 'error');
    } else {
      showToast(message || 'Unable to log in. Please try again.', 'error');
    }
  }
}

    async function executeSignup() {
  const name = document.getElementById('signupName')?.value.trim();
  const email = document.getElementById('signupEmail')?.value.trim().toLowerCase();
  const college = document.getElementById('signupCollege')?.value.trim();
  const pass = document.getElementById('signupPassword')?.value;
  const confirmPass = document.getElementById('signupConfirmPassword')?.value;

  if (!name || !email || !pass) {
    return showToast('Please enter your name, email, and password.', 'error');
  }

  if (pass !== confirmPass) {
    return showToast('Passwords do not match.', 'error');
  }

  if (pass.length < 6) {
    return showToast('Password must be at least 6 characters.', 'error');
  }

  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email,
      password: pass,
      options: {
        data: {
          display_name: name,
          college: college || 'Institute'
        }
      }
    });

    if (error) {
      return showToast(error.message, 'error');
    }

    if (data.session && data.user) {
      const user = data.user;
      const userEmail = user.email.toLowerCase();

      const account = {
        email: userEmail,
        displayName: name,
        college: college || 'Institute'
      };

      const existingIndex = appData.accounts.findIndex(
        a => a.email.toLowerCase() === userEmail
      );

      if (existingIndex >= 0) {
        appData.accounts[existingIndex] = account;
      } else {
        appData.accounts.push(account);
      }

      if (!appData.userStores[userEmail]) {
        appData.userStores[userEmail] =
          createDefaultAccountData(userEmail, name, college || 'Institute');
      }

      isAuthenticated = true;
      localStorage.setItem('remyndr_authenticated', 'true');

      switchActiveAccount(userEmail);
      saveAppData();

      showToast(`Welcome ${name}! Account created.`);
      navigateTo('dashboard');
    } else {
      showToast(
        'Account created! Check your email to confirm your account before logging in.',
        'success'
      );
    }

  } catch (err) {
    console.error('Supabase signup error:', err);
    showToast('Unable to create account. Please try again.', 'error');
  }
}

    function openForgotPasswordModal() {
      openModal(`
        <div class="space-y-3 text-xs">
          <h3 class="text-base font-black">${t('auth.resetPassTitle')}</h3>
          <p class="text-slate-500">${t('auth.resetPassSub')}</p>
          <div>
            <label class="block font-bold mb-1">${t('auth.emailLabel')}</label>
            <input type="email" id="recoveryEmail" value="${appData.activeAccountEmail}" class="w-full p-2.5 bg-slate-50 dark:bg-slate-800 border rounded-xl outline-none" />
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button onclick="closeModal()" class="px-4 py-2 border rounded-xl font-bold">${t('common.close')}</button>
            <button onclick="showToast('Password reset link simulated.'); closeModal();" class="px-5 py-2 bg-blue-600 text-white rounded-xl font-bold">Send Recovery Link</button>
          </div>
        </div>
      `);
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('remyndr_theme', isDark ? 'dark' : 'light');
    }

    if (localStorage.getItem('remyndr_theme') === 'dark') {
      document.documentElement.classList.add('dark');
    }

    document.getElementById('mobileMenuBtn').onclick = () => {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
    };

    document.getElementById('globalSearchInput').oninput = (e) => {
      if (e.target.value.trim().length > 1) navigateTo('circulars');
    };

    window.onload = async function() {
      initStationeryBackground();

      // Step 3: restore authentication from the real Supabase session,
      // rather than trusting only the browser's local login flag.
      try {
        const { data: sessionData, error: sessionError } = await supabaseClient.auth.getSession();
        const session = sessionData?.session;

        if (sessionError) {
          console.error('Could not restore Supabase session:', sessionError);
        }

        if (session?.user) {
          const user = session.user;
          const email = (user.email || '').toLowerCase();
          const displayName = user.user_metadata?.display_name || user.user_metadata?.full_name || email.split('@')[0] || 'Student';
          const college = user.user_metadata?.college || 'Institute';

          let account = appData.accounts.find(a => (a.email || '').toLowerCase() === email);
          if (!account) {
            account = { email, displayName, college };
            appData.accounts.push(account);
          } else {
            account.displayName = displayName;
            account.college = college;
          }

          if (!appData.userStores[email]) {
            appData.userStores[email] = createDefaultAccountData(email, displayName, college);
          }

          isAuthenticated = true;
          localStorage.setItem('remyndr_authenticated', 'true');
          localStorage.setItem('remyndr_active_email', email);
          switchActiveAccount(email);

          const hash = window.location.hash.replace('#', '') || 'dashboard';
          currentRoute = hash === 'login' ? 'dashboard' : hash;
          await loadCircularsFromSupabase(false);
        } else {
          // A local flag alone is not a valid login session.
          isAuthenticated = false;
          localStorage.removeItem('remyndr_authenticated');
          localStorage.removeItem('remyndr_active_email');
          currentRoute = 'login';
          window.location.hash = 'login';
        }
      } catch (err) {
        console.error('Session restore failed:', err);
        isAuthenticated = false;
        localStorage.removeItem('remyndr_authenticated');
        currentRoute = 'login';
        window.location.hash = 'login';
      }

      changeLang(currentLang);
    };
  </script>
